services:
  diskguard-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: diskguard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./srcML:/app/srcML
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    networks:
      - diskguard-network

  diskguard-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: diskguard-frontend
    ports:
      - "3000:80"
    networks:
      - diskguard-network
    depends_on:
      - diskguard-backend

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: diskguard-tensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./srcML:/app/srcML:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      pip install --quiet tensorboard &&
      python -m tensorboard
      --logdir_spec=anomaly:/app/srcML/tensorflow_anomaly/logs,classification:/app/srcML/tensorflow_classification/logs,clustering:/app/srcML/tensorflow_clustering/logs
      --host 0.0.0.0
      --port 6006
    networks:
      - diskguard-network

networks:
  diskguard-network:
    driver: bridge