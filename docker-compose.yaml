services:
  disk-ml-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: diskBackend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./srcML:/app/srcML
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    networks:
      - disk-network

  disk-ml-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: diskFrontend
    ports:
      - "3000:80"
    networks:
      - disk-network
    depends_on:
      - disk-ml-backend

  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: diskTensorboard
    ports:
      - "6006:6006"
    volumes:
      - ./srcML:/app/srcML:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      pip install --quiet tensorboard &&
      python -m tensorboard
      --logdir_spec=anomaly:/app/srcML/tensorflow_anomaly/logs,classification:/app/srcML/tensorflow_classification/logs,clustering:/app/srcML/tensorflow_clustering/logs
      --host 0.0.0.0
      --port 6006
    networks:
      - disk-network

networks:
  disk-network:
    driver: bridge